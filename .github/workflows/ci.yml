name: CI

on:
  pull_request:
  push:
    branches: [master]

# A branch only needs its newest commit checked, and Actions minutes are
# capped on the organisation's plan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # `node-version-file` rather than the version inline, so the pin has one source.
      # This repo pins node in `.node-version`, which setup-node has always read, so
      # unlike the sibling repos on `mise.toml` it needs no unreleased action.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Test
        run: npm test
